{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Apply saved theme immediately to prevent flash of default theme -->
<script>(function(){var t=localStorage.getItem('summit-theme')||'dark';document.documentElement.setAttribute('data-theme',t);})()</script>
<link rel="icon" type="image/png" href="{{.HomeURL}}/static/img/favicon.png">
<title>Summit{{if .CurrentGuild}} | {{.CurrentGuild.Name}}{{end}}</title>
<!-- Discord embed link -->
<meta content="Summit" property="og:title"/>
<meta content="Reach the peak of server management" property="og:description"/>
<meta content="{{.HomeURL}}" property="og:url"/>
<meta content="#08060d" data-react-helmet="true" name="theme-color"/>
<!--Bootstrap CSS-->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
<!--Bootstrap JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
<!-- DataTables JS (Not using CSS) -->
<script src="https://cdn.datatables.net/v/bs5/jq-3.7.0/moment-2.29.4/dt-2.3.8/sb-1.8.4/datatables.min.js" integrity="sha384-ZgJFL84Lq8cW9FP0k3SCwAEK2USHzZIKqQjPPAq3A/5EhA1+WkgY97hBUPEAQ7S6" crossorigin="anonymous"></script>
<!-- Font awesome -->
<script src="https://kit.fontawesome.com/f8e6b016a3.js" crossorigin="anonymous"></script>
<!-- Google fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
<!-- Custom CSS -->
{{if eq .Path "" "/"}}<link rel="stylesheet" href="{{.HomeURL}}/static/css/main.css">{{else}}<link rel="stylesheet" href="{{.HomeURL}}/static/css/dashboard.css">{{end}}
<link rel="stylesheet" href="{{.HomeURL}}/static/css/themes/core.css">
<link rel="stylesheet" href="{{.HomeURL}}/static/css/themes/{{.Theme}}.css">
<script src="{{.HomeURL}}/static/js/themeSwitcher.js" defer></script>
{{end}}
